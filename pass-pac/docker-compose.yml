services:
  frontend:
    build:
      context: ./frontend
    container_name: pass-pac-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/lib:/app/lib
      - frontend_next_dev:/app/.next-dev
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: pass-pac-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REPORTS_DIR: ${REPORTS_DIR}
      MOCK_DATA_DIR: ${MOCK_DATA_DIR}
      SIMULATOR_CARD_FILE: ${SIMULATOR_CARD_FILE:-flipper-imported-cards.json}
      APP_MODE: ${APP_MODE}
      PROXMARK_BRIDGE_URL: ${PROXMARK_BRIDGE_URL}
      PROXMARK_CLIENT_PATH: ${PROXMARK_CLIENT_PATH}
      PROXMARK_PORT: ${PROXMARK_PORT}
      PROXMARK_COMMAND_TIMEOUT_SECONDS: ${PROXMARK_COMMAND_TIMEOUT_SECONDS}
    volumes:
      - ./backend/app:/app/app
      - ./reports:/app/reports
      - ./mock-data:/app/mock-data
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: pass-pac-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d

volumes:
  frontend_next_dev:
  postgres_data:
